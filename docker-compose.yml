version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cine_paradiso_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cine_paradiso_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - FLASK_HOST=0.0.0.0
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cine_paradiso_frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:5001/api
      - FLASK_HOST=0.0.0.0
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend

volumes:
  mysql_data: