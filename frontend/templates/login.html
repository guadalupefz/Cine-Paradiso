{% extends "base.html" %}
{% block title %}Iniciar sesión - Cine Paradiso{% endblock %}
{% block content %}
<section class="formulario-acceso">
  <h2>Iniciar sesión</h2>
  <p>Ingresá para consultar tus compras o administrar el cine.</p>
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ destino or '' }}">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" name="email" autocomplete="username" maxlength="150" required value="{{ request.form.get('email','') }}">
    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
  </form>
  <a href="{{ url_for('index') }}">Volver a la cartelera</a>
</section>
{% endblock %}
