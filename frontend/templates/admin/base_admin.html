<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Administración - Cine Paradiso{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/estilos.css') }}"></head>
<body><header><a class="logo" href="{{ url_for('index') }}"><h1>Cine Paradiso</h1></a><p class="admin-leyenda">Administración · {{ usuario_actual.nombre }}</p></header>
<div class="contenedor_admin"><nav class="menu_admin" aria-label="Administración">
<a href="{{ url_for('admin_resumen') }}">Resumen</a><a href="{{ url_for('admin_peliculas') }}">Películas</a><a href="{{ url_for('admin_funciones') }}">Funciones</a><a href="{{ url_for('admin_servicios') }}">Servicios</a><a href="{{ url_for('validar_qr') }}">Validar QR</a><a href="{{ url_for('index') }}">Ver cartelera</a>
<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">Cerrar sesión</button></form></nav>
<main class="contenido_admin">{% with mensajes=get_flashed_messages(with_categories=true) %}{% for categoria,mensaje in mensajes %}<p role="status" class="aviso {{ categoria }}">{{ mensaje }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></div></body></html>
