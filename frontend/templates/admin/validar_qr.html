{% extends "admin/base_admin.html" %}

{% block title %}Validar QR{% endblock %}

{% block content %}

<h2>Validar QR</h2>
<button type="button" id="btn-escanear">
    Escanear QR con cámara
</button>

<div id="reader" style="width:300px; margin-top:15px;"></div>

<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="campo_formulario">
        <label for="qr_token">Codigo de entrada</label>
        <input type="text" id="qr_token" name="qr_token">
    </div>

    <div class="campo_formulario">
        <label for="id_funcion">ID de funcion</label>
        <input type="number" id="id_funcion" name="id_funcion">
    </div>

    <button type="submit">Validar QR</button>
</form>

{% if resultado %}
<p>{{ resultado.mensaje }}</p>
{% endif %}

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
document.getElementById("btn-escanear").addEventListener("click", function () {

    const scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },
        function(decodedText) {

            document.getElementById("qr_token").value = decodedText;

            scanner.stop();

            alert("QR leído correctamente");
        }
    ).catch(function(error) {
        console.error(error);
        alert("No se pudo abrir la cámara");
    });

});
</script>
{% endblock %}
