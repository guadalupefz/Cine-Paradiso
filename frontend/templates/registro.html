{% extends "base.html" %}
{% block title %}Crear cuenta · Cine Paradiso{% endblock %}
{% block content %}
<section class="formulario-acceso">
    <h2>Crear cuenta</h2>
    <p>Registrate para continuar con tu visita al cine.</p>
    {% if error_formulario %}<p class="aviso error" role="alert">{{ error_formulario }}</p>{% endif %}
    <form method="post" action="{{ url_for('registro') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ destino or '' }}">
        <label for="nombre">Nombre</label><input id="nombre" name="nombre" autocomplete="given-name" maxlength="100" required value="{{ datos_formulario.nombre }}">
        <label for="apellido">Apellido</label><input id="apellido" name="apellido" autocomplete="family-name" maxlength="100" required value="{{ datos_formulario.apellido }}">
        <label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" maxlength="150" required value="{{ datos_formulario.email }}">
        <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" maxlength="256" required>
        <label for="confirmar_password">Confirmar contraseña</label><input id="confirmar_password" name="confirmar_password" type="password" autocomplete="new-password" maxlength="256" required>
        <button type="submit">Crear cuenta</button>
    </form>
    <a href="{{ url_for('login', next=destino) }}">Ya tengo cuenta · Iniciar sesión</a>
</section>
{% endblock %}
